<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost & Found Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Campus Lost & Found</h1>
    <div class="demo-info">
     <p>🔑 Admin demo: <strong>admin@lostandfound.com</strong> / <strong>ad123</strong></p>
    </div>

    <!-- Toggle buttons -->
    <div class="toggle-btns">
      <button id="showLogin" class="active" onclick="showForm('login')">Login</button>
      <button id="showRegister" onclick="showForm('register')">Register</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
      <input type="text" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPass" placeholder="Password" required>
      <button type="submit">Login</button>
      <p id="loginError" class="error"></p>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="hidden">
      <input type="text" id="regName" placeholder="Full Name" required>
      <input type="text" id="regDept" placeholder="Department" required>
      <input type="tel" id="regContact" placeholder="Contact Number" maxlength="10" pattern="[0-9]{10}" required>
      <input type="email" id="regEmail" placeholder="Email" required>
      <input type="password" id="regPass" placeholder="Password" required>
      <button type="submit">Register</button>
      <p id="registerError" class="error"></p>
    </form>

  </div>

  <script src="app.js"></script>
</body>
</html>
